aid: 5miles
name: 5miles
description: '5miles is a hyper-local mobile marketplace for buying and selling used
  goods — cars, furniture, electronics, fashion, baby and kids items — and for offering
  local services such as beauty, auto repair and home cleaning. Founded in 2014 in
  Dallas, Texas by Lucas Lu and acquired by a China-based buyer in 2020, the company
  runs the 5miles iOS and Android apps, the 5miles.com web marketplace, and the 5miles
  Dash bidding site. 5miles operates as an end-user consumer product only: it publishes
  no developer portal, no API reference and no machine-readable specification, and
  its api.5miles.com host serves the company''s own mobile and web clients rather
  than third-party integrators.'
